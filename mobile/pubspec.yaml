name: oim_mobile
description: OceanTalk mobile app (Android / iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  oim_core:
    path: ../packages/oim_core
  path_provider: ^2.1.0
  file_picker: ^10.3.2
  emoji_picker_flutter: ^4.4.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
